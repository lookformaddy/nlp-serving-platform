# CI
# Ships as docs/github-actions-ci.yml — to activate, move to
# .github/workflows/ci.yml (the push integration used for this repo
# cannot write workflow files directly).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: Run demo end to end
        run: PYTHONPATH=src python scripts/demo.py
